<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Envio de cards</title>
<style>body{font-family:system-ui,sans-serif;background:#0B2619;color:#F4F7F2;padding:24px}button{font-size:18px;padding:10px 16px;background:#F5C518;border:0;border-radius:6px;font-weight:700}</style>
</head><body>
<p>Página interna do Almanaque da Nova Era: leva os cards da rodada até o X.</p>
<button id="abrir">Abrir o X</button> <span id="st"></span>
<script>
let w = null;
document.getElementById('abrir').onclick = () => { w = window.open('https://x.com/compose/post', 'almanaque_x'); document.getElementById('st').textContent = w ? 'X aberto' : 'bloqueado'; };
window.enviar = async (nome) => {
  if (!w || w.closed) return 'X não está aberto';
  const buf = await (await fetch('./' + nome, { cache: 'no-store' })).arrayBuffer();
  w.postMessage({ tipo: 'card-almanaque', nome, buf }, 'https://x.com', [buf]);
  return 'enviado ' + nome;
};
</script></body></html>
